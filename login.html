 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPER WIN Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{
background:#171334;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow:hidden;
}

.bg-circle{
position:absolute;
border-radius:50%;
background:rgba(255,255,255,.05);
}

.circle1{
width:280px;
height:280px;
top:-120px;
left:-120px;
}

.circle2{
width:320px;
height:320px;
bottom:-160px;
right:-160px;
}

.auth-card{
width:100%;
max-width:400px;
background:#241d55;
padding:30px 22px;
border-radius:30px;
box-shadow:0 10px 40px rgba(0,0,0,.4);
position:relative;
overflow:hidden;
}

.auth-card::before{
content:'';
position:absolute;
width:200px;
height:200px;
border-radius:50%;
background:rgba(255,255,255,.05);
top:-100px;
right:-100px;
}

.logo{
font-size:34px;
font-weight:800;
text-align:center;
margin-bottom:8px;
background:linear-gradient(180deg,#8fe6ff,#7d81ff,#ff79eb);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.subtitle{
text-align:center;
color:#cfcfff;
font-size:13px;
margin-bottom:28px;
}

.input-box{
margin-bottom:16px;
}

.input-box label{
display:block;
margin-bottom:8px;
font-size:14px;
font-weight:500;
color:#fff;
}

.input-box input{
width:100%;
height:55px;
border:none;
outline:none;
background:#2a245b;
border-radius:16px;
padding:0 18px;
font-size:15px;
color:white;
}

.input-box input::placeholder{
color:#a9a9d5;
}

.auth-btn{
width:100%;
height:55px;
border:none;
border-radius:18px;
font-size:16px;
font-weight:700;
color:white;
cursor:pointer;
background:linear-gradient(90deg,#ff79eb,#5cb5ff);
box-shadow:0 5px 15px rgba(92,181,255,.35);
}

.auth-btn:active{
transform:scale(.98);
}

.extra{
display:flex;
justify-content:space-between;
margin-top:14px;
font-size:13px;
}

.extra a{
color:#8fe6ff;
text-decoration:none;
}

.bottom-text{
text-align:center;
margin-top:22px;
font-size:14px;
color:#d6d6e8;
}

.bottom-text a{
color:#ff8de8;
text-decoration:none;
font-weight:600;
}

.loader{
display:none;
text-align:center;
margin-top:15px;
color:white;
}

.spinner{
display:none;
width:35px;
height:35px;
border:4px solid rgba(255,255,255,.2);
border-top:4px solid #fff;
border-radius:50%;
animation:spin 1s linear infinite;
margin:15px auto;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

</style>
</head>

<body>

<div class="bg-circle circle1"></div>
<div class="bg-circle circle2"></div>

<div class="auth-card">

<div class="logo">SUPER WIN</div>

<div class="subtitle">
Welcome Back
</div>

<div class="input-box">
<label>Phone Number</label>
<input
id="phone"
type="text"
placeholder="Enter Phone Number">
</div>

<div class="input-box">
<label>Password</label>

<div style="position:relative;">

<input
id="password"
type="password"
placeholder="Enter Password">

<span id="togglePassword"
style="
position:absolute;
right:18px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
color:#ccc;
font-size:18px;
">
👁
</span>

</div>
</div>

<button class="auth-btn" id="loginBtn">
LOGIN
</button>

<div class="spinner" id="loader"></div>

<div class="extra">
<a href="#">Forgot Password?</a>
<a href="#">Help</a>
</div>

<div class="bottom-text">
Don't have an account?
<a href="/register">Register</a>
</div>

</div>

<script>

const loginBtn=document.getElementById("loginBtn");

document.getElementById("togglePassword")
.addEventListener("click",()=>{

const password=
document.getElementById("password");

if(password.type==="password"){
password.type="text";
}else{
password.type="password";
}

});

async function loginUser(){

const phone=
document.getElementById("phone").value.trim();

const password=
document.getElementById("password").value;

if(!phone || !password){

alert("Please enter phone and password");
return;

}

if(!/^[0-9]{10}$/.test(phone)){

alert("Enter valid 10 digit phone number");
return;

}

if(password.length < 6){

alert("Password must be at least 6 characters");
return;

}

loginBtn.disabled=true;
loginBtn.innerHTML="Please Wait...";

document.getElementById("loader").style.display="block";

try{

const response=await fetch(
"https://super-win.onrender.com/api/login",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
phone:phone,
password:password
})

});

const result=await response.json();

document.getElementById("loader").style.display="none";

loginBtn.disabled=false;
loginBtn.innerHTML="LOGIN";

if(response.ok){

if(result.token){
localStorage.setItem("token",result.token);
}

if(result.user){
localStorage.setItem(
"user",
JSON.stringify(result.user)
);
}

alert("Login Successful");
 if(result.user){
localStorage.setItem(
"user",
JSON.stringify(result.user)
);
}

window.location.href="/home.html";

}else{

alert(
result.error ||
result.message ||
"Invalid Credentials"
);

}

}catch(error){

document.getElementById("loader").style.display="none";

loginBtn.disabled=false;
loginBtn.innerHTML="LOGIN";

alert("Server Error");

console.log(error);

}

}

loginBtn.addEventListener("click",loginUser);

document.addEventListener("keydown",function(e){

if(e.key==="Enter"){
loginUser();
}

});

</script>

</body>
</html>
