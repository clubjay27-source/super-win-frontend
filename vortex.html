<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Galactic Premium Clone</title>
    <style>
        /* --- GLOBAL SYSTEM RESET --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #050608;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Mobile Viewport Wrapper Container */
        .vortex-app-frame {
            width: 100%;
            max-width: 395px;
            background-color: #090a10;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            border: 1px solid #16192b;
            position: relative;
            overflow: hidden;
        }

        /* Futuristic Top Header Area */
        .header-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: linear-gradient(180deg, #111424 0%, #090a10 100%);
            border-bottom: 1px solid #16192b;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .vortex-logo-txt {
            color: #00ffcc;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 20px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
        }
        .vortex-logo-txt span {
            color: #ffffff;
            font-weight: 300;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .wallet-neon-box {
            background: rgba(0, 255, 204, 0.05);
            border: 1px solid rgba(0, 255, 204, 0.2);
            border-radius: 6px;
            padding: 4px 12px;
        }

        .wallet-amount {
            color: #00ffcc;
            font-weight: bold;
            font-size: 13px;
        }

        /* History Ribbon Strip Slider */
        .history-ribbon-strip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background-color: #07080d;
            border-bottom: 1px solid #121524;
            overflow: hidden;
        }

        .ribbon-badges-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            flex: 1;
        }

        .vortex-badge {
            font-size: 11px;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 4px;
            color: #00ffcc;
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid rgba(0, 255, 204, 0.25);
            white-space: nowrap;
            animation: badgePop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes badgePop {
            from { opacity: 0; transform: scale(0.6); }
            to { opacity: 1; transform: scale(1); }
        }

        .vortex-badge.purple-deep {
            color: #ff00ff;
            background: rgba(255, 0, 255, 0.1);
            border: 1px solid rgba(255, 0, 255, 0.3);
        }

        /* --- THE VORTEX THEATER ENGINE ARENA --- */
        .theater-stage-box {
            background-color: #07080d;
            padding: 6px 8px;
        }

        .main-space-arena {
            height: 220px;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at center, #0c081f 0%, #030307 100%);
            border: 1px solid #16192b;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ambient Cosmic Star Particle Background */
        .cosmic-stars-mesh {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px);
            background-size: 120px 120px;
            background-position: 0 0, 40px 60px;
            opacity: 0.4;
            z-index: 1;
        }

        /* Central Neon Black Hole Vortex Graphics */
        .central-vortex-core {
            position: absolute;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #000000 40%, #1a0033 70%, transparent 100%);
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(155, 89, 182, 0.6), inset 0 0 15px rgba(0, 255, 204, 0.5);
            z-index: 2;
            animation: spinVortex 6s linear infinite;
        }
        @keyframes spinVortex {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        /* Live Centered Scale Counter Typography */
        .live-multiplier-counter {
            position: absolute;
            font-size: 42px;
            font-weight: 900;
            color: #ffffff;
            z-index: 10;
            font-family: Impact, sans-serif;
            letter-spacing: 0.5px;
            text-shadow: 0 0 15px rgba(0,0,0,0.8), 0 0 5px rgba(0, 255, 204, 0.5);
        }

        /* SVG Orbital Path Engine Line Mesh */
        .svg-vector-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }
        .orbital-track-line {
            stroke: rgba(0, 255, 204, 0.15);
            stroke-width: 1.5;
            fill: none;
            stroke-dasharray: 4 4;
        }

        /* Space Capsule Orbiter Actor Graphic Element */
        .orbiter-capsule-sprite {
            position: absolute;
            width: 24px;
            height: 24px;
            z-index: 5;
            will-change: left, top, transform;
        }
        .orbiter-core-design {
            width: 100%;
            height: 100%;
            background-color: #00ffcc;
            clip-path: polygon(50% 0%, 100% 100%, 50% 75%, 0% 100%); /* Aerodynamic Rocket Shard */
            box-shadow: 0 0 12px #00ffcc;
            filter: drop-shadow(0px 0px 8px rgba(0, 255, 204, 0.8));
        }

        /* --- CONTROL ENTRY PANEL MATRIX --- */
        .betting-deck-wrapper {
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .console-bet-tile {
            background-color: #0b0d16;
            border-radius: 12px;
            padding: 10px;
            border: 1px solid #16192b;
        }

        .console-action-row {
            display: flex;
            gap: 8px;
        }

        .left-numeric-modifiers {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 125px;
        }

        .stepper-input-container {
            display: flex;
            align-items: center;
            background-color: #040508;
            border-radius: 6px;
            height: 32px;
            justify-content: space-between;
            padding: 0 4px;
            border: 1px solid #1c2038;
        }

        .stepper-btn {
            background: transparent;
            border: none;
            color: #5d6578;
            font-size: 16px;
            width: 26px;
            height: 26px;
            cursor: pointer;
            font-weight: bold;
        }

        .stepper-input-container input {
            width: 55px;
            background: transparent;
            border: none;
            color: #ffffff;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            outline: none;
        }

        .pills-quick-matrix {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
        }

        .pill-btn {
            background-color: #040508;
            border: 1px solid #1c2038;
            color: #727b93;
            padding: 4px 0;
            border-radius: 4px;
            font-size: 10.5px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        /* Neon Teal Hyper Action Submit Button */
        .giant-bet-trigger-btn {
            flex: 1;
            background: linear-gradient(180deg, #00ffcc 0%, #00b38f 100%);
            border: none;
            border-radius: 6px;
            color: #030307;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            transition: transform 0.1s ease;
        }
        .giant-bet-trigger-btn:active {
            transform: scale(0.97);
        }
        .giant-bet-trigger-btn .txt-main {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }
        .giant-bet-trigger-btn .txt-sub {
            font-size: 12px;
            font-weight: bold;
            opacity: 0.85;
        }

        /* --- TOAST ALERTS INTERFACE OVERLAY --- */
        .insufficient-funds-toast {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: #7b1111;
            color: #ffffff;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            z-index: 100;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid #ff3333;
        }
        .insufficient-funds-toast.active-toast {
            top: 60px;
        }

        /* --- LIVE SYSTEM LEDGER SHEET RECORD MATRIX --- */
        .live-bets-ledger-panel {
            background-color: #07080d;
            border: 1px solid #16192b;
            border-radius: 8px;
            margin: 2px 8px 8px 8px;
            padding: 8px;
            height: 130px;
            display: flex;
            flex-direction: column;
        }

        .ledger-panel-header {
            display: flex;
            justify-content: space-between;
            font-size: 9.5px;
            color: #464b5e;
            font-weight: bold;
            padding-bottom: 6px;
            border-bottom: 1px solid #16192b;
            text-transform: uppercase;
        }
        .ledger-panel-header span { flex: 1; }
        .ledger-panel-header span.right-align { text-align: right; }
        .ledger-panel-header span.center-align { text-align: center; }

        .ledger-rows-viewport {
            flex: 1;
            overflow-y: auto;
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .ledger-rows-viewport::-webkit-scrollbar { width: 0px; }

        .bot-data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            padding: 3.5px 0;
            border-bottom: 1px solid #0f111d;
            animation: rowFadeIn 0.25s ease-out;
        }
        @keyframes rowFadeIn {
            from { opacity: 0; transform: translateY(-3px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .bot-data-row span { flex: 1; }
        .bot-username { color: #727b93; font-family: monospace; }
        .bot-bet-val { color: #ffffff; }
        .bot-mult-val { color: #00ffcc; text-align: center; font-weight: bold; }
        .bot-mult-val.lost { color: #363a4a; }
        .bot-cashout-val { color: #00ffcc; text-align: right; font-weight: bold; }
        .bot-cashout-val.lost { color: #1f2230; }
    </style>
</head>
<body>

    <div class="vortex-app-frame">
        <div class="insufficient-funds-toast" id="funds-toast">
            🌌 Core Warning: Insufficient Credits for Orbit Simulation!
        </div>

        <header class="header-top-bar">
            <div class="header-left">
                <div class="vortex-logo-txt">Vortex<span>Game</span></div>
            </div>
            <div class="header-right">
                <div class="wallet-neon-box">
                    <span class="wallet-amount">⌫ 0.00 CC</span>
                </div>
            </div>
        </header>

        <div class="history-ribbon-strip">
            <div class="ribbon-badges-wrapper" id="history-badges-shelf">
                <span class="vortex-badge">1.45x</span>
                <span class="vortex-badge purple-deep">7.32x</span>
                <span class="vortex-badge">1.12x</span>
                <span class="vortex-badge">2.04x</span>
                <span class="vortex-badge">1.68x</span>
            </div>
        </div>

        <div class="theater-stage-box">
            <div class="main-space-arena">
                <div class="cosmic-stars-mesh"></div>
                
                <div class="central-vortex-core"></div>
                
                <div class="live-multiplier-counter" id="hud-multiplier-lbl">1.00x</div>
                
                <svg class="svg-vector-container">
                    <circle id="guide-track-circle" class="orbital-track-line" cx="190" cy="110" r="0" />
                </svg>

                <div class="orbiter-capsule-sprite" id="orbiter-actor-node">
                    <div class="orbiter-core-design"></div>
                </div>
            </div>
        </div>

        <div class="betting-deck-wrapper">
            <div class="console-bet-tile">
                <div class="console-action-row">
                    <div class="left-numeric-modifiers">
                        <div class="stepper-input-container">
                            <button class="stepper-btn" onclick="offsetBetAmount('field-idx-1', -10)">-</button>
                            <input type="number" id="field-idx-1" value="10">
                            <button class="stepper-btn" onclick="offsetBetAmount('field-idx-1', 10)">+</button>
                        </div>
                        <div class="pills-quick-matrix">
                            <button class="pill-btn" onclick="directSetAmount('field-idx-1', 10)">10</button>
                            <button class="pill-btn" onclick="directSetAmount('field-idx-1', 100)">100</button>
                            <button class="pill-btn" onclick="directSetAmount('field-idx-1', 200)">200</button>
                            <button class="pill-btn" onclick="directSetAmount('field-idx-1', 500)">500</button>
                        </div>
                    </div>
                    <button class="giant-bet-trigger-btn" onclick="triggerToastAlert()">
                        <span class="txt-main">BET</span>
                        <span class="txt-sub" id="lbl-sub-1">10.00 CC</span>
                    </button>
                </div>
            </div>

            <div class="console-bet-tile">
                <div class="console-action-row">
                    <div class="left-numeric-modifiers">
                        <div class="stepper-input-container">
                            <button class="stepper-btn" onclick="offsetBetAmount('field-idx-2', -10)">-</button>
                            <input type="number" id="field-idx-2" value="10">
                            <button class="stepper-btn" onclick="offsetBetAmount('field-idx-2', 10)">+</button>
                        </div>
                        <div class="pills-quick-matrix">
                            <button class="pill-btn" onclick="directSetAmount('field-idx-2', 10)">10</button>
                            <button class="pill-btn" onclick="directSetAmount('field-idx-2', 100)">100</button>
                            <button class="pill-btn" onclick="directSetAmount('field-idx-2', 200)">200</button>
                            <button class="pill-btn" onclick="directSetAmount('field-idx-2', 500)">500</button>
                        </div>
                    </div>
                    <button class="giant-bet-trigger-btn" onclick="triggerToastAlert()">
                        <span class="txt-main">BET</span>
                        <span class="txt-sub" id="lbl-sub-2">10.00 CC</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="live-bets-ledger-panel">
            <div class="ledger-panel-header">
                <span>Pilot ID</span>
                <span>Credits</span>
                <span class="center-align">Ratio</span>
                <span class="right-align">Payout</span>
            </div>
            <div class="ledger-rows-viewport" id="bot-rows-shelf">
                </div>
        </div>
    </div>

    <script>
        const hudMultiplierLbl = document.getElementById('hud-multiplier-lbl');
        const orbiterActorNode = document.getElementById('orbiter-actor-node');
        const guideTrackCircle = document.getElementById('guide-track-circle');
        const fundsToast = document.getElementById('funds-toast');
        const botRowsShelf = document.getElementById('bot-rows-shelf');
        const historyBadgesShelf = document.getElementById('history-badges-shelf');

        let liveValue = 1.00;
        let vortexCrashThreshold = 2.80;
        let currentRadianAngle = 0;
        let toastTrackerTimer = null;

        // Stage Matrix Center Reference
        const centerX = 190;
        const centerY = 110;

        // --- INSUFFICIENT FUNDS ALERT POPUP TOAST ---
        function triggerToastAlert() {
            fundsToast.classList.remove('active-toast');
            clearTimeout(toastTrackerTimer);
            void fundsToast.offsetWidth;
            fundsToast.classList.add('active-toast');
            toastTrackerTimer = setTimeout(() => {
                fundsToast.classList.remove('active-toast');
            }, 3000);
        }

        // --- BOT SIMULATION RECORD ENGINES ---
        const spacePilots = ['Nebula_X', 'Cosmo_Rider', 'Orion_9', 'Void_Runner', 'Starlight', 'Galactic_01', 'Quantum_C', 'ApexPilot'];
        
        function streamFakeBotRow() {
            if (liveValue <= 1.05) return;
            const pilot = spacePilots[Math.floor(Math.random() * spacePilots.length)] + Math.floor(Math.random() * 89 + 10);
            const credits = Math.floor(Math.random() * 40 + 5) * 10;
            const cashedOut = Math.random() > 0.35;
            let ratio = (Math.random() * (liveValue - 1.01) + 1.01).toFixed(2);

            let rowHtml = '';
            if (cashedOut && parseFloat(ratio) < parseFloat(liveValue)) {
                let payout = (credits * ratio).toFixed(2);
                rowHtml = `
                    <div class="bot-data-row">
                        <span class="bot-username">${pilot}</span>
                        <span class="bot-bet-val">${credits} CC</span>
                        <span class="bot-mult-val">${ratio}x</span>
                        <span class="bot-cashout-val">${payout} CC</span>
                    </div>`;
            } else {
                rowHtml = `
                    <div class="bot-data-row">
                        <span class="bot-username">${pilot}</span>
                        <span class="bot-bet-val">${credits} CC</span>
                        <span class="bot-mult-val lost">-</span>
                        <span class="bot-cashout-val lost">0.00 CC</span>
                    </div>`;
            }

            botRowsShelf.insertAdjacentHTML('afterbegin', rowHtml);
            if (botRowsShelf.children.length > 15) {
                botRowsShelf.removeChild(botRowsShelf.lastChild);
            }
        }

        setInterval(() => {
            if (liveValue < vortexCrashThreshold && liveValue > 1.04) {
                if (Math.random() > 0.4) streamFakeBotRow();
            }
        }, 550);

        // --- ADD VALUE TO HISTORY STRIP ---
        function appendHistoryBadge(crashNum) {
            const badge = document.createElement('span');
            badge.classList.add('vortex-badge');
            badge.innerText = crashNum + 'x';
            if (parseFloat(crashNum) >= 2.00) {
                badge.classList.add('purple-deep');
            }
            historyBadgesShelf.insertBefore(badge, historyBadgesShelf.firstChild);
            if (historyBadgesShelf.children.length > 8) {
                historyBadgesShelf.removeChild(historyBadgesShelf.lastChild);
            }
        }

        // --- CHRONO SPIRAL VORTEX MATHEMATICS SIMULATION ---
        function startVortexSimulation() {
            liveValue = 1.00;
            vortexCrashThreshold = (Math.random() * 5.2 + 1.05).toFixed(2);
            hudMultiplierLbl.style.color = '#ffffff';
            orbiterActorNode.style.opacity = '1';
            currentRadianAngle = 0;

            const simulationClock = setInterval(() => {
                if (liveValue < vortexCrashThreshold) {
                    liveValue += 0.015;
                    hudMultiplierLbl.innerText = liveValue.toFixed(2) + 'x';

                    // Progress scalar vector ratio
                    let pct = (liveValue - 1) / 5.5; 
                    if (pct > 1) pct = 1;

                    // Spiral Calculus Logic: Radius grows as capsule builds speed away from singularity core
                    let baseRadius = 42; 
                    let maxRadiusGrowth = 55;
                    let currentRadius = baseRadius + (pct * maxRadiusGrowth);

                    // Angular velocity scale formula
                    currentRadianAngle += (0.05 + (pct * 0.03)); 

                    // Polar coordinates mapping structure conversions
                    let locX = centerX + Math.cos(currentRadianAngle) * currentRadius;
                    let locY = centerY + Math.sin(currentRadianAngle) * currentRadius;

                    // Tangential Direction/Face rotation angle 
                    let faceAngle = currentRadianAngle + (Math.PI / 2); // Always perpendicular to radius 
                    let degreeFace = faceAngle * (180 / Math.PI);

                    // Translate element matrix
                    orbiterActorNode.style.left = `${locX - 12}px`;
                    orbiterActorNode.style.top = `${locY - 12}px`;
                    orbiterActorNode.style.transform = `rotate(${degreeFace}deg)`;

                    // Render dynamic background tracking ring scale guide line
                    guideTrackCircle.setAttribute('r', currentRadius);

                } else {
                    clearInterval(simulationClock);
                    hudMultiplierLbl.innerText = "Sucked In!";
                    hudMultiplierLbl.style.color = '#ff3366';
                    orbiterActorNode.style.opacity = '0';
                    guideTrackCircle.setAttribute('r', '0');

                    appendHistoryBadge(vortexCrashThreshold);

                    setTimeout(startVortexSimulation, 3500);
                }
            }, 35);
        }

        // Execute Core Thread
        startVortexSimulation();

        // UI Modifier Logic Handlers
        function offsetBetAmount(id, val) {
            const el = document.getElementById(id);
            let cur = parseInt(el.value) || 10;
            let fin = cur + val;
            if (fin < 1) fin = 1;
            el.value = fin;
            syncLabels(id, fin);
        }

        function directSetAmount(id, val) {
            document.getElementById(id).value = val;
            syncLabels(id, val);
        }

        function syncLabels(id, val) {
            const lbl = id === 'field-idx-1' ? 'lbl-sub-1' : 'lbl-sub-2';
            document.getElementById(lbl).innerText = val + ".00 CC";
        }
    </script>
</body>
</html>
