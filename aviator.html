<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Authentic UI</title>
    <script src="https://cdn.socketio.org/4.7.2/socket.io.min.js"></script>
    <style>
        /* --- BRANDING & CSS RESET --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0c0e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }

        /* Full App Wrapper */
        .aviator-app {
            width: 100%;
            max-width: 412px; /* Perfect Mobile Ratio */
            background-color: #101114;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            border: 1px solid #1c1d22;
        }

        /* Top Header Navigation */
        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background-color: #1b1c21;
        }

        .nav-left-group {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .back-icon {
            font-size: 16px;
            color: #9299a6;
            cursor: pointer;
        }

        .logo-text {
            color: #cb0629;
            font-weight: 900;
            font-style: italic;
            font-size: 20px;
            letter-spacing: -0.5px;
        }

        .help-badge {
            background: #2c2d34;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            color: #9299a6;
            font-weight: bold;
        }

        .nav-right-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .wallet-pill {
            background: linear-gradient(to right, #121c32, #0d1629);
            border: 1px solid #1a325c;
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 2px 2px 2px 8px;
            gap: 6px;
        }

        .wallet-icon {
            width: 16px;
            height: 16px;
            background: radial-gradient(circle, #ffdf00, #d4af37);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 5px rgba(255,223,0,0.5);
        }

        .wallet-bal {
            color: #ffffff;
            font-weight: 700;
            font-size: 13px;
        }

        .wallet-add {
            background-color: #1251c6;
            border: none;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-weight: 900;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- THEATER SCREEN BOX --- */
        .theater-screen {
            background-color: #141518;
            padding: 6px 8px;
        }

        .screen-canvas {
            background: 
                repeating-conic-gradient(from 0deg at 50% 50%, rgba(26, 68, 102, 0.15) 0deg 15deg, transparent 15deg 30deg),
                radial-gradient(circle at 50% 50%, #17212f 0%, #080a0e 100%);
            height: 195px;
            border-radius: 14px;
            position: relative;
            border: 1px solid #1c1d22;
            overflow: hidden;
        }

        .meta-row {
            position: absolute;
            top: 8px;
            width: 100%;
            padding: 0 12px;
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #5d6370;
            z-index: 15;
            font-weight: bold;
        }

        .live-multiplier-big {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 58px;
            font-weight: 900;
            color: #ffffff;
            z-index: 10;
            text-shadow: 0px 4px 15px rgba(0, 0, 0, 0.75);
        }

        /* Vector Graph Engine */
        .animation-viewport {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .curve-svg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .plane-wrapper {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 5;
            width: 65px;
            height: 38px;
            transform: translate(-50%, 50%);
            will-change: left, bottom;
            display: none;
        }

        /* Left Side Ticks */
        .left-axis-ticks {
            position: absolute;
            left: 8px;
            top: 30px;
            bottom: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 1;
        }
        .axis-dot {
            width: 4px;
            height: 4px;
            background-color: #2b61ab;
            border-radius: 50%;
            opacity: 0.8;
        }

        /* --- BETTING CARDS --- */
        .betting-panel {
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bet-card {
            background-color: #1b1c21;
            border-radius: 18px;
            padding: 12px;
            border: 1px solid #232429;
            display: flex;
            flex-direction: column;
        }

        .action-row {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        .left-controls-block {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 140px;
        }

        .numeric-adjuster {
            display: flex;
            align-items: center;
            background-color: #000000;
            border-radius: 24px;
            height: 38px;
            justify-content: space-between;
            padding: 0 4px;
        }

        .adjust-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 20px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 300;
        }

        .numeric-adjuster input {
            width: 65px;
            background: transparent;
            border: none;
            color: #ffffff;
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            outline: none;
        }

        .giant-bet-trigger {
            flex: 1;
            background-color: #28c711;
            border: none;
            border-radius: 16px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            padding: 10px;
            box-shadow: 0 4px 12px rgba(40, 199, 17, 0.25);
            transition: background-color 0.2s ease;
        }

        .giant-bet-trigger.booked {
            background-color: #d29406 !important;
            box-shadow: 0 4px 12px rgba(210, 148, 6, 0.25);
        }

        .giant-bet-trigger.active-bet {
            background-color: #cb0629 !important;
            box-shadow: 0 4px 12px rgba(203, 6, 41, 0.25);
        }

        .giant-bet-trigger .lbl-main {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .giant-bet-trigger .lbl-sub {
            font-size: 13px;
            font-weight: bold;
            opacity: 0.9;
        }

        .quick-pills-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
        }

        .pill-opt {
            background-color: #101114;
            border: none;
            color: #707785;
            padding: 4px 0;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="aviator-app">
        <header class="top-navbar">
            <div class="nav-left-group">
                <span class="back-icon" onclick="window.location.href='home.html'">&#10094;</span>
                <span class="logo-text">Aviator</span>
                <span class="help-badge">?</span>
            </div>
            <div class="nav-right-group">
                <div class="wallet-pill">
                    <span class="wallet-icon"></span>
                    <span class="wallet-bal" id="wallet-balance">₹0.00</span>
                    <button class="wallet-add" onclick="window.location.href='deposit.html'">+</button>
                </div>
            </div>
        </header>

        <div class="theater-screen">
            <div class="screen-canvas">
                <div class="meta-row">
                    <div class="round-box">
                        <span>Live Session</span>
                    </div>
                </div>
                
                <div class="live-multiplier-big" id="live-counter">Waiting</div>
                
                <div class="left-axis-ticks">
                    <div class="axis-dot"></div><div class="axis-dot"></div>
                    <div class="axis-dot"></div><div class="axis-dot"></div>
                </div>

                <div class="animation-viewport">
                    <svg class="curve-svg" viewBox="0 0 400 200" preserveAspectRatio="none">
                        <path id="trajectory-fill" d="M 20 180 L 20 180 L 20 180 Z" fill="rgba(218, 4, 43, 0.2)"></path>
                        <path id="trajectory-line" d="M 20 180 Q 20 180, 20 180" fill="none" stroke="#e0052d" stroke-width="4.5" stroke-linecap="round"></path>
                    </svg>

                    <div class="plane-wrapper" id="jet-carrier">
                        <svg viewBox="0 0 60 40" width="100%" height="100%">
                            <path d="M10,22 L25,20 L50,23 L55,18 L48,12 L25,16 Z" fill="#cf0427" />
                            <line x1="55" y1="10" x2="55" y2="26" stroke="#ffffff" stroke-width="2.5"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <div class="betting-panel">
            <div class="bet-card">
                <div class="action-row">
                    <div class="left-controls-block">
                        <div class="numeric-adjuster">
                            <button class="adjust-btn" onclick="modifyInput('bet-val-1', -10)">&#8722;</button>
                            <input type="number" id="bet-val-1" value="10.00">
                            <button class="adjust-btn" onclick="modifyInput('bet-val-1', 10)">&#43;</button>
                        </div>
                        <div class="quick-pills-row">
                            <button class="pill-opt" onclick="directSet('bet-val-1', 10)">10</button>
                            <button class="pill-opt" onclick="directSet('bet-val-1', 100)">100</button>
                        </div>
                    </div>
                    <button class="giant-bet-trigger" id="btn-trigger-1" onclick="handleBetClick('1')">
                        <span class="lbl-main" id="lbl-main-1">BET</span>
                        <span class="lbl-sub" id="btn-lbl-1">10.00 INR</span>
                    </button>
                </div>
            </div>

            <div class="bet-card">
                <div class="action-row">
                    <div class="left-controls-block">
                        <div class="numeric-adjuster">
                            <button class="adjust-btn" onclick="modifyInput('bet-val-2', -10)">&#8722;</button>
                            <input type="number" id="bet-val-2" value="10.00">
                            <button class="adjust-btn" onclick="modifyInput('bet-val-2', 10)">&#43;</button>
                        </div>
                        <div class="quick-pills-row">
                            <button class="pill-opt" onclick="directSet('bet-val-2', 10)">10</button>
                            <button class="pill-opt" onclick="directSet('bet-val-2', 100)">100</button>
                        </div>
                    </div>
                    <button class="giant-bet-trigger" id="btn-trigger-2" onclick="handleBetClick('2')">
                        <span class="lbl-main" id="lbl-main-2">BET</span>
                        <span class="lbl-sub" id="btn-lbl-2">10.00 INR</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem("token");
        if (!token) {
            window.location.href = "login.html";
        }

        // Backend Server Connection Map Structure
        const socket = io("https://super-win.onrender.com", {
    auth: { token: token },
    transports: ['websocket', 'polling'] // Render bypass ke liye zaroori hai
});

        const counterView = document.getElementById('live-counter');
        const jetCarrier = document.getElementById('jet-carrier');
        const splinePath = document.getElementById('trajectory-line');
        const splineFill = document.getElementById('trajectory-fill');

        let localBetState = {
            "1": { status: "idle" }, 
            "2": { status: "idle" }
        };

        socket.on('balance_update', (data) => {
            document.getElementById('wallet-balance').innerText = `₹${parseFloat(data.balance).toFixed(2)}`;
        });

        socket.on('game_tick', (data) => {
            if (data.status === 'waiting') {
                counterView.style.color = '#ffffff';
                counterView.innerText = `Starts in ${data.countdown}s`;
                jetCarrier.style.display = 'none';
                resetTrajectory();
            } 
            else if (data.status === 'flying') {
                jetCarrier.style.display = 'block';
                counterView.style.color = '#ffffff';
                counterView.innerText = data.multiplier.toFixed(2) + 'x';
                
                // Active Math Matrix Path
                updateAnimation(data.multiplier);

                // Auto Sync Real-time Engine
                ["1", "2"].forEach(box => {
                    let btn = document.getElementById(`btn-trigger-${box}`);
                    let lbl = document.getElementById(`lbl-main-${box}`);
                    let amt = parseFloat(document.getElementById(`bet-val-${box}`).value);
                    
                    if (localBetState[box].status === "booked" || localBetState[box].status === "active") {
                        localBetState[box].status = "active";
                        btn.className = "giant-bet-trigger active-bet";
                        lbl.innerText = "CASH OUT";
                        document.getElementById(`btn-lbl-${box}`).innerText = `₹ ${(amt * data.multiplier).toFixed(2)}`;
                    }
                });
            } 
            else if (data.status === 'crashed') {
                counterView.innerText = "Flew Away!";
                counterView.style.color = '#cb0629';
                resetButtonsUI();
            }
        });

        socket.on('bet_status', (data) => {
            let box = data.box;
            let status = data.status;
            localBetState[box].status = status;

            let btn = document.getElementById(`btn-trigger-${box}`);
            let lbl = document.getElementById(`lbl-main-${box}`);

            if (status === 'booked' || status === 'booked_next') {
                btn.className = "giant-bet-trigger booked";
                lbl.innerText = "CANCEL";
            }
        });

        socket.on('cash_out_success', (data) => {
            let box = data.box;
            localBetState[box].status = "idle";
            let btn = document.getElementById(`btn-trigger-${box}`);
            btn.className = "giant-bet-trigger";
            document.getElementById(`lbl-main-${box}`).innerText = "BET";
            refreshButtonSubLabel(box);
        });

        socket.on('error', (data) => {
            alert(data.message);
            resetButtonsUI();
        });

        function handleBetClick(boxId) {
            let state = localBetState[boxId].status;
            let amt = parseFloat(document.getElementById(`bet-val-${boxId}`).value);

            if (state === "idle") {
                socket.emit('place_bet', { token: token, box: boxId, amount: amt });
            } 
            else if (state === "active") {
                socket.emit('cash_out', { token: token, box: boxId });
            }
            else if (state === "booked" || state === "booked_next") {
                resetButtonsUI();
            }
        }

        function updateAnimation(mult) {
            let normState = (mult - 1) / 5; 
            if (normState > 1) normState = 1;
            if (normState < 0) normState = 0;

            let xCoordinates = 20 + (normState * 310);
            let yCoordinates = 175 - (normState * 125);

            jetCarrier.style.left = `${xCoordinates}px`;
            jetCarrier.style.top = `${yCoordinates}px`; 

            let pathD = `M 20 180 Q ${xCoordinates * 0.45} 180, ${xCoordinates} ${yCoordinates}`;
            splinePath.setAttribute('d', pathD);
            let fillD = `${pathD} L ${xCoordinates} 180 L 20 180 Z`;
            splineFill.setAttribute('d', fillD);
        }

        function resetTrajectory() {
            splinePath.setAttribute('d', 'M 20 180 L 20 180');
            splineFill.setAttribute('d', 'M 20 180 L 20 180');
        }

        function resetButtonsUI() {
            ["1", "2"].forEach(box => {
                localBetState[box].status = "idle";
                let btn = document.getElementById(`btn-trigger-${box}`);
                btn.className = "giant-bet-trigger";
                document.getElementById(`lbl-main-${box}`).innerText = "BET";
                refreshButtonSubLabel(box);
            });
        }

        function modifyInput(nodeId, offset) {
            const field = document.getElementById(nodeId);
            let output = (parseFloat(field.value) || 10) + offset;
            if (output < 10) output = 10;
            field.value = output.toFixed(2);
            refreshButtonSubLabel(nodeId === 'bet-val-1' ? '1' : '2');
        }

        // Strict String Alignment Function
        function directSet(nodeId, exactVal) {
            document.getElementById(nodeId).value = exactVal.toFixed(2);
            refreshButtonSubLabel(nodeId === 'bet-val-1' ? '1' : '2');
        }

        function refreshButtonSubLabel(box) {
            let val = parseFloat(document.getElementById(`bet-val-${box}`).value) || 10;
            document.getElementById(`btn-lbl-${box}`).innerText = val.toFixed(2) + " INR";
        }
    </script>
</body>
</html>
